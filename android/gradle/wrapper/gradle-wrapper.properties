# Wrapper de Gradle para android/ (AGP 8.5.2 en android/build.gradle).
#
# AGP 8.5 exige Gradle 8.7 o superior; 8.9 es la combinación estable que se
# probó con Java 17. Si se sube AGP, subir también distributionUrl.
#
# IMPORTANTE: aquí solo vive la configuración. El binario
# gradle/wrapper/gradle-wrapper.jar NO se versiona (binario opaco en el repo) y
# NO se ha inventado. Se genera una única vez desde android/ con el Gradle del
# sistema:
#
#   gradle wrapper --gradle-version 8.9 --distribution-type bin
#
# Ese comando crea gradlew, gradlew.bat, gradle/wrapper/gradle-wrapper.jar y
# respeta este archivo. Después ya se puede usar ./gradlew.
#
# El build real de CI y de esta máquina NO usa Gradle: build-apk.sh compila con
# aapt2/javac/d8/apksigner de build-tools 35.0.0 porque dl.google.com devuelve
# HTTP 404 al resolver AGP. El wrapper queda listo para cuando eso se resuelva.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
