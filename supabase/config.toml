project_id = "hmcvujyqloyjdvngpdxz"

[auth]
site_url = "https://palmyracrm.onrender.com"
additional_redirect_urls = [
  "https://palmyracrm.onrender.com/**",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**"
]
enable_signup = true

[auth.email]
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirma tu cuenta PALMYRA"
content_path = "./supabase/email-templates/confirm.html"

[auth.email.template.recovery]
subject = "Restablece tu contraseña PALMYRA"
content_path = "./supabase/email-templates/recovery.html"

# Los workers se autentican con x-worker-secret contra Vault y son llamados por
# pg_cron/pg_net sin JWT: deben desplegarse con verify_jwt desactivado.
[functions.deliver-notifications]
verify_jwt = false

[functions.monitor-exchange-rates]
verify_jwt = false

# Requiere el JWT del dueño/encargado que invita al trabajador.
[functions.send-company-invitation]
verify_jwt = true

# Licencias firmadas y telemetría: siempre con el JWT del usuario autenticado.
[functions.issue-lease]
verify_jwt = true

[functions.revoke-lease]
verify_jwt = true

[functions.license-telemetry]
verify_jwt = true

# El planificador llama con x-worker-secret (sin JWT) o el equipo con la
# service role; la función valida ambos casos por su cuenta.
[functions.materialize-local-changes]
verify_jwt = false

# Canje del enlace de dispositivo desde el PC/APK sin sesión previa: el token
# es el secreto, así que no hay JWT que verificar. La RPC interna es
# security definer y solo service_role puede ejecutarla.
[functions.device-access]
verify_jwt = false
