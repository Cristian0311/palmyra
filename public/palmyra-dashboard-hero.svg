<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-label="Escena empresarial PALMYRA con asesora, paneles de negocio y La Habana">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".62" stop-color="#f7f4ff"/>
    <stop offset="1" stop-color="#eee9ff"/>
  </linearGradient>
  <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#32127a"/>
    <stop offset=".52" stop-color="#6428c9"/>
    <stop offset="1" stop-color="#8b5cf6"/>
  </linearGradient>
  <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4c1d95"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4c1d95"/>
    <stop offset=".55" stop-color="#28105f"/>
    <stop offset="1" stop-color="#6d3bd2"/>
  </linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd9bd"/>
    <stop offset="1" stop-color="#c97b58"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#32127a" flood-opacity=".16"/>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>

<rect width="1400" height="430" rx="34" fill="url(#bg)"/>

<!-- subtle corporate background -->
<circle cx="1090" cy="75" r="150" fill="#8b5cf6" opacity=".08"/>
<circle cx="1230" cy="320" r="190" fill="#4f46e5" opacity=".06"/>
<g opacity=".35" fill="#ffffff" filter="url(#soft)">
  <ellipse cx="1040" cy="86" rx="150" ry="28"/>
  <ellipse cx="1260" cy="120" rx="120" ry="24"/>
</g>

<!-- Havana / El Morro as a subtle visual accent -->
<g transform="translate(1040 118)" opacity=".72">
  <path d="M0 180 L34 126 L78 112 L120 122 L163 94 L218 110 L274 88 L342 108 L386 148 L430 190 L430 210 L0 210Z" fill="#bca98e"/>
  <path d="M35 126 L78 112 L120 122 L163 94 L218 110 L274 88 L342 108 L386 148 L374 164 L26 159Z" fill="#d7c5a5"/>
  <path d="M165 102 L183 37 L208 20 L232 38 L238 105Z" fill="#c8b596"/>
  <path d="M183 37 L208 20 L232 38 L223 49 L193 49Z" fill="#eee2cb"/>
  <path d="M196 18 L208 5 L220 18Z" fill="#8f7557"/>
  <path d="M208 5 L208 -15" stroke="#75583e" stroke-width="3"/>
  <path d="M208 -14 L208 7 L239 -4Z" fill="#7c3aed" opacity=".9"/>
  <g fill="#947b5d">
    <rect x="45" y="150" width="13" height="12"/><rect x="95" y="145" width="13" height="12"/>
    <rect x="265" y="140" width="13" height="12"/><rect x="324" y="150" width="13" height="12"/>
  </g>
</g>

<!-- signature PALMYRA wave, like an enterprise software banner -->
<path d="M0 302 C170 258 285 328 450 290 C620 250 725 335 895 294 C1065 253 1195 294 1400 230 L1400 430 L0 430Z" fill="url(#wave)"/>
<path d="M0 346 C185 294 300 367 472 327 C645 286 742 371 925 330 C1100 291 1230 326 1400 272 L1400 430 L0 430Z" fill="url(#wave2)" opacity=".46"/>
<path d="M0 300 C170 257 285 327 450 289 C620 249 725 334 895 293 C1065 252 1195 293 1400 229" fill="none" stroke="#c4b5fd" stroke-opacity=".42" stroke-width="3"/>

<!-- floating business cards -->
<g filter="url(#shadow)">
  <rect x="770" y="54" width="132" height="74" rx="14" fill="#ffffff" stroke="#e8e0fb"/>
  <rect x="789" y="74" width="40" height="9" rx="4.5" fill="#6d28d9" opacity=".9"/>
  <rect x="789" y="93" width="82" height="7" rx="3.5" fill="#e8e4f2"/>
  <rect x="789" y="108" width="60" height="6" rx="3" fill="#d7d0ea"/>

  <rect x="920" y="38" width="126" height="82" rx="14" fill="#ffffff" stroke="#e8e0fb"/>
  <path d="M944 98 L964 81 L979 90 L1004 61" fill="none" stroke="#22a06b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="944" cy="98" r="5" fill="#22a06b"/><circle cx="1004" cy="61" r="5" fill="#22a06b"/>

  <rect x="1064" y="70" width="124" height="74" rx="14" fill="#ffffff" stroke="#e8e0fb"/>
  <circle cx="1091" cy="101" r="15" fill="#ede9fe"/><path d="M1083 102 L1089 108 L1100 94" fill="none" stroke="#6d28d9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1117" y="91" width="48" height="7" rx="3.5" fill="#d9d2eb"/>
  <rect x="1117" y="106" width="31" height="6" rx="3" fill="#ece8f5"/>
</g>

<!-- professional PALMYRA advisor -->
<g transform="translate(635 36)" filter="url(#shadow)">
  <ellipse cx="170" cy="382" rx="155" ry="20" fill="#24104e" opacity=".24"/>
  <path d="M72 383 C77 292 93 236 122 208 C150 181 198 182 227 209 C257 239 277 301 286 383Z" fill="url(#suit)"/>
  <path d="M136 207 L170 274 L204 207 L188 194 L170 214 L152 194Z" fill="#ffffff"/>
  <path d="M153 210 L170 239 L187 210" fill="#ede9fe"/>
  <path d="M161 258 L170 272 L179 258 L178 314 L170 324 L162 314Z" fill="#f6c443"/>
  <circle cx="170" cy="132" r="73" fill="url(#skin)"/>
  <path d="M100 141 C82 80 120 43 170 42 C222 41 259 78 242 143 C222 111 205 96 178 91 C150 87 125 104 100 141Z" fill="#3b2421"/>
  <path d="M110 95 C130 49 198 31 235 70 C220 35 160 24 120 50 C97 65 90 84 110 95Z" fill="#2d1a18"/>
  <circle cx="143" cy="132" r="6.5" fill="#2b1e1b"/><circle cx="197" cy="132" r="6.5" fill="#2b1e1b"/>
  <circle cx="141" cy="130" r="2" fill="#fff"/><circle cx="195" cy="130" r="2" fill="#fff"/>
  <path d="M153 163 Q170 176 187 163" fill="none" stroke="#a84d42" stroke-width="5" stroke-linecap="round"/>
  <path d="M134 111 Q144 104 155 110" fill="none" stroke="#3b2421" stroke-width="7" stroke-linecap="round"/>
  <path d="M185 110 Q197 104 208 111" fill="none" stroke="#3b2421" stroke-width="7" stroke-linecap="round"/>

  <!-- waving arm -->
  <path d="M91 255 C55 235 44 197 52 153 C58 123 67 100 75 85" fill="none" stroke="#efb084" stroke-width="30" stroke-linecap="round"/>
  <path d="M76 91 C57 70 52 52 58 38 C63 26 74 30 76 45 L80 62 L84 30 C86 15 98 17 99 32 L96 64 L105 32 C109 19 120 24 118 39 L110 69 L124 47 C131 36 141 43 135 55 L115 89 C106 103 91 108 76 91Z" fill="url(#skin)"/>
  <path d="M79 90 C90 83 100 78 109 69" stroke="#c97857" stroke-width="3" opacity=".5"/>

  <!-- second arm holding tablet -->
  <path d="M246 263 C283 282 298 307 307 341" fill="none" stroke="#2a125f" stroke-width="28" stroke-linecap="round"/>
  <path d="M306 337 C320 344 331 356 332 370" fill="none" stroke="#efb084" stroke-width="22" stroke-linecap="round"/>
  <rect x="238" y="255" width="78" height="98" rx="10" transform="rotate(12 238 255)" fill="#211044"/>
  <rect x="246" y="263" width="62" height="78" rx="6" transform="rotate(12 246 263)" fill="#ffffff"/>
  <rect x="258" y="276" width="37" height="7" rx="3.5" transform="rotate(12 258 276)" fill="#7c3aed"/>
  <rect x="258" y="293" width="45" height="6" rx="3" transform="rotate(12 258 293)" fill="#ddd6fe"/>
  <path d="M260 323 L274 311 L284 318 L301 302" fill="none" stroke="#22a06b" stroke-width="4" stroke-linecap="round"/>
</g>

<!-- small PALMYRA wordmark accent -->
<g transform="translate(1225 340)">
  <circle cx="22" cy="22" r="22" fill="#ffffff" opacity=".95"/>
  <path d="M9 30 C12 20 12 12 18 9 C25 6 33 12 35 18 C29 16 25 17 22 21 C18 25 16 29 16 34Z" fill="#6d28d9"/>
  <text x="53" y="28" font-family="Arial,sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="2">PALMYRA</text>
</g>
</svg>