appId: com.palmyra.pos
productName: PALMYRA POS
copyright: PALMYRA

# Reglas de publicación (no cambiar sin revisar el pipeline):
#   - Siempre se empaqueta con --publish never (npm run desktop:dist). El único
#     que publica es .github/workflows/release.yml, y solo tras verificar los
#     artefactos y la firma ES256 de update-manifest.json.
#   - El updater solo acepta HTTPS: provider github sirve todo por https y
#     scripts/check-release-assets.mjs rechaza cualquier URL http en el
#     manifiesto. No se admiten feeds en claro ni mirrors sin TLS.
#   - La autenticidad de la actualización la da la firma ES256 del manifiesto
#     (ver src/services/updates/verify.ts), no la firma Authenticode del Setup.

directories:
  output: release
  buildResources: build

# El servidor de escritorio se empaqueta como un único archivo
# (dist/desktop-server.cjs) y main.electron.cjs lo carga con require() dentro
# del mismo proceso, así que Electron resuelve la lectura desde el asar. Los
# datos escribibles viven en app.getPath('userData'), nunca en la app.
asar: true
npmRebuild: false

# Integridad del asar: electron-builder 25.x todavía no expone `electronFuses`
# (enableEmbeddedAsarIntegrityValidation / onlyLoadAppFromAsar). Activar esos
# fuses exige subir electron-builder o aplicar @electron/fuses en un paso de
# post-empaquetado; no se hace aquí para no romper `npm run desktop:dist`, que
# hoy publica con esta versión.

files:
  - "dist/**/*"
  - "main.electron.cjs"
  - "electron/preload.cjs"
  - "!**/*.map"
  - "!node_modules/**/*"

# El proceso principal empaquetado es el bundle de esbuild
# (dist/desktop-main.cjs), que ya incluye electron-updater. En desarrollo
# `electron .` sigue usando main.electron.cjs con node_modules.
extraMetadata:
  main: dist/desktop-main.cjs

# Origen de las actualizaciones automáticas. electron-builder escribe
# resources/app-update.yml con estos datos; electron-updater consulta
# latest.yml del último Release y descarga el Setup del mismo Release.
# Publicar es manual (desktop:dist usa --publish never).
# GitHub Releases siempre se sirve por HTTPS; si algún día se cambia el
# provider, la URL debe seguir siendo https y el manifiesto debe seguir firmado.
publish:
  provider: github
  owner: Cristian0311
  repo: palmyra
  releaseType: release

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # Identidad de editor fijada de antemano: cuando exista el certificado, el
  # CN debe ser exactamente PALMYRA para que electron-builder firme sin tocar
  # el pipeline. Hoy no hay certificado y NO se inventa ninguno.
  #
  # Para firmar de verdad, el entorno del pipeline debe exportar (nunca se
  # guardan en el repo):
  #   CSC_LINK        (o WIN_CSC_LINK)        ruta o base64 del .pfx
  #   CSC_KEY_PASSWORD (o WIN_CSC_KEY_PASSWORD) contraseña de ese .pfx
  # Sin esas variables electron-builder empaqueta sin firmar y SmartScreen
  # seguirá advirtiendo. No se activa `forceCodeSigning` a propósito: haría
  # fallar el pipeline actual, que publica sin certificado.
  signtoolOptions:
    publisherName: PALMYRA
  # Mientras el Setup no esté firmado, electron-updater no debe verificar la
  # firma Authenticode: app-update.yml llevaría publisherName y rechazaría
  # cualquier descarga unsigned con ERR_UPDATER_INVALID_SIGNATURE. El ancla de
  # confianza actual es la firma ES256 de update-manifest.json. Al incorporar
  # el certificado (CSC_LINK + CSC_KEY_PASSWORD) hay que poner esta opción en
  # true (o quitarla) y volver a probar una actualización real.
  verifyUpdateCodeSignature: false
  # Nombre estable a propósito: /download/windows redirige a este asset fijo en
  # GitHub Releases. Si cambia el nombre, la descarga de la landing devuelve 404.
  # electron-updater también depende de este nombre: latest.yml apunta a él.
  artifactName: PALMYRA-POS-Setup.${ext}

# Instalación por usuario (sin UAC). Sin la página "todos/yo" las
# actualizaciones se pueden instalar en silencio con /S.
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  include: build/installer.nsh
  allowToChangeInstallationDirectory: false
  # Sin actualización diferencial no se genera .blockmap. El release publica
  # exactamente cinco archivos y latest.yml no debe referenciar un blockmap que
  # no viaja en el Release (electron-updater caería a descarga completa o 404).
  # scripts/check-release-assets.mjs lee esta opción: con `false` el .blockmap
  # es opcional; si se activa, el pipeline lo exige (--require-blockmap) y
  # además hay que publicarlo y actualizar verify-release-assets.mjs.
  differentialPackage: false
  # "always" (no `true`): además de la instalación nueva, recrea el acceso
  # directo en reinstalaciones y actualizaciones aunque el usuario lo haya
  # borrado. Con `true` electron-builder solo lo crea en instalación limpia.
  createDesktopShortcut: "always"
  createStartMenuShortcut: true
  shortcutName: PALMYRA POS
  uninstallDisplayName: PALMYRA POS
  deleteAppDataOnUninstall: false

linux:
  target:
    - AppImage
  category: Office
  icon: build/icon.png

mac:
  target:
    - dmg
  category: public.app-category.business
  icon: build/icon.png
