appId: com.palmyra.pos
productName: PALMYRA POS
copyright: PALMYRA

directories:
  output: release
  buildResources: build

# El servidor de escritorio se empaqueta como un único archivo
# (dist/desktop-server.cjs), así que la app no necesita node_modules.
# asar:false evita problemas al ejecutar ese archivo con ELECTRON_RUN_AS_NODE.
asar: false
npmRebuild: false

files:
  - "dist/**/*"
  - "main.electron.cjs"
  - "electron/preload.cjs"
  - "!**/*.map"
  - "!node_modules/**/*"

# El proceso principal empaquetado es el bundle de esbuild
# (dist/desktop-main.cjs), que ya incluye electron-updater. En desarrollo
# `electron .` sigue usando main.electron.cjs con node_modules.
extraMetadata:
  main: dist/desktop-main.cjs

# Origen de las actualizaciones automáticas. electron-builder escribe
# resources/app-update.yml con estos datos; electron-updater consulta
# latest.yml del último Release y descarga el Setup del mismo Release.
# Publicar es manual (desktop:dist usa --publish never).
publish:
  provider: github
  owner: Cristian0311
  repo: palmyra
  releaseType: release

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # Nombre estable a propósito: /download/windows redirige a este asset fijo en
  # GitHub Releases. Si cambia el nombre, la descarga de la landing devuelve 404.
  # electron-updater también depende de este nombre: latest.yml apunta a él.
  artifactName: PALMYRA-POS-Setup.${ext}

# Instalación por usuario (sin UAC). Sin la página "todos/yo" las
# actualizaciones se pueden instalar en silencio con /S.
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  include: build/installer.nsh
  allowToChangeInstallationDirectory: false
  # "always" (no `true`): además de la instalación nueva, recrea el acceso
  # directo en reinstalaciones y actualizaciones aunque el usuario lo haya
  # borrado. Con `true` electron-builder solo lo crea en instalación limpia.
  createDesktopShortcut: "always"
  createStartMenuShortcut: true
  shortcutName: PALMYRA POS
  uninstallDisplayName: PALMYRA POS
  deleteAppDataOnUninstall: false

linux:
  target:
    - AppImage
  category: Office
  icon: build/icon.png

mac:
  target:
    - dmg
  category: public.app-category.business
  icon: build/icon.png
