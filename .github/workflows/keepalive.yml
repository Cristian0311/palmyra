name: PALMYRA keepalive

# Histórico: este flujo mantenía despierta la instancia gratuita de Render
# (palmyracrm.onrender.com) con un ping cada 10 minutos.
#
# Hoy no hay despliegue público activo: la aplicación se instala y opera en
# local (Windows, Android y PWA). El flujo queda solo como disparo manual y sin
# peticiones externas, para no golpear un host que ya no existe y poder
# reactivarlo con un botón cuando vuelva a haber un servidor publicado.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: palmyra-keepalive
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Recordar que no hay despliegue activo
        run: |
          echo "Sin despliegue público activo: no se realiza ninguna petición externa."
          echo "Cuando exista un servidor publicado, añade aquí el paso de ping."
